global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "bluewhale-app"
    metrics_path: "/actuator/prometheus"
    scheme: "http"
    static_configs:
      - targets: ["bluewhale-app:8080"]
    http_headers:
      X-Metrics-Token:
        values:
          - "change-me-metrics-token"
