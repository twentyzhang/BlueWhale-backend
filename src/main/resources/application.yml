server:
  port: 8080

jwt:
  # Base64 编码的 HMAC-SHA256 密钥（至少 256 位）
  # 生产环境通过环境变量 JWT_SECRET 注入，本地开发使用默认值
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWJsdWV3aGFsZS1qd3Q=}
  # Token 有效期（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  application:
    name: bluewhale
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 8   # 最大连接数
        max-idle: 8     # 最大空闲连接数
        min-idle: 0     # 最小空闲连接数
        max-wait: -1ms  # 连接等待超时（-1 表示永不超时）

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3305/bluewhale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.twentyzhang.bluewhale.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.twentyzhang.bluewhale: debug
