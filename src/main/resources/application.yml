server:
  port: 8080

jwt:
  # Base64 编码的 HMAC-SHA256 密钥（至少 256 位）
  # 生产环境通过环境变量 JWT_SECRET 注入，本地开发使用默认值
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWJsdWV3aGFsZS1qd3Q=}
  # access token 有效期（毫秒），默认 15 分钟（配合 refreshToken 轮换与即时撤销）
  expiration: ${JWT_EXPIRATION:900000}

payment:
  mock:
    # 回调验签密钥（生产经环境变量注入，本地用默认值）
    secret: ${PAYMENT_MOCK_SECRET:mock-payment-hmac-secret-key-bluewhale}
    # 模拟收银台触发后，异步回调延迟毫秒（模拟支付宝回调晚到）
    callback-delay-ms: ${PAYMENT_CALLBACK_DELAY_MS:1500}

search:
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:products}
    vector-size: 1024
    distance: Cosine
  tongyi:
    # 通义 DashScope embedding API key（生产经环境变量注入）
    api-key: ${DASHSCOPE_API_KEY:}
    embedding-url: ${TONGYI_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
    embedding-model: text-embedding-v3
    embedding-dimension: 1024
  outbox:
    poll-batch-size: 50
    poll-delay-ms: 5000
    max-retry: 5
  semantic:
    default-top-k: 50

spring:
  application:
    name: bluewhale
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8   # 最大连接数
          max-idle: 8     # 最大空闲连接数
          min-idle: 0     # 最小空闲连接数
          max-wait: -1ms  # 连接等待超时（-1 表示永不超时）

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3305/bluewhale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Flyway 数据库迁移：应用启动时自动执行 classpath:db/migration 下未应用的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 对已存在表但无 flyway_schema_history 的库做基线：基线版本设为 1，
    # 使非空库跳过 V1 建表、只补跑 R__ 重灌种子；空库则正常从 V1 开始执行。
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.twentyzhang.bluewhale.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务配置
bluewhale:
  order:
    # 未支付订单保留天数，超过即由定时任务（OrderAutocancelJob）自动取消。
    # 默认 14 天；演示时可调小（如 1）以便快速观察效果。
    auto-cancel-days: 14

logging:
  level:
    com.twentyzhang.bluewhale: debug
